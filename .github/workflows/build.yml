name: Build

# Builds and verifies both supported targets. Windows also checks fused PE
# executables; Fedora checks the portable .love archive against LÖVE 11.5.

on:
  push:
    branches: [main, dev-build]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Keep in sync with src/conf.lua's t.version.
  LOVE_VERSION: "11.5"
  # Keep in sync with tools/build.ps1's $RCEDIT_VERSION.
  RCEDIT_VERSION: "v2.0.0"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache LÖVE download
        id: love-cache
        uses: actions/cache@v5
        with:
          path: love-dist
          key: love-${{ env.LOVE_VERSION }}-win64

      - name: Download LÖVE
        if: steps.love-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/love2d/love/releases/download/$env:LOVE_VERSION/love-$env:LOVE_VERSION-win64.zip"
          $zip = Join-Path $env:RUNNER_TEMP 'love.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath 'love-dist'

      - name: Add LÖVE to PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $loveDir = Get-ChildItem 'love-dist' -Directory | Select-Object -First 1
          if (-not $loveDir) { throw 'love-dist has no extracted folder inside it.' }
          if (-not (Test-Path (Join-Path $loveDir.FullName 'love.exe'))) {
              throw "love.exe not found in $($loveDir.FullName)"
          }
          $loveDir.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # tools/build.ps1's -Fuse downloads this itself (Get-RcEdit) if it's
      # missing -- caching it here just saves that download on every run.
      - name: Cache rcedit download
        uses: actions/cache@v5
        with:
          path: .tools
          key: rcedit-${{ env.RCEDIT_VERSION }}

      # Each combination is its own step so a failure names exactly which
      # packaging mode broke, rather than one opaque "build failed".
      - name: Build + verify (.love)
        shell: pwsh
        run: tools/build.ps1 -Verify

      - name: Build + verify (fused .exe)
        shell: pwsh
        run: tools/build.ps1 -Fuse -Verify

      - name: Build + verify (bytecode .love)
        shell: pwsh
        run: tools/build.ps1 -Bytecode -Verify

      - name: Build + verify (fused .exe, bytecode)
        shell: pwsh
        run: tools/build.ps1 -Fuse -Bytecode -Verify

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Starsown-dist
          path: dist/
          if-no-files-found: ignore

  linux-fedora:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 10
    steps:
      # The Fedora container starts intentionally minimal. Install git before
      # checkout, plus the exact runtime and virtual display used to verify.
      - name: Install Fedora build dependencies
        run: >-
          dnf install -y
          git love zip unzip
          xorg-x11-server-Xvfb xorg-x11-xauth

      - name: Checkout
        uses: actions/checkout@v6

      - name: Build + verify (.love)
        shell: bash
        run: >-
          xvfb-run -a bash tools/build-linux.sh
          --verify
          --output dist/Starsown.love

      - name: Build + verify (bytecode .love)
        shell: bash
        run: >-
          xvfb-run -a bash tools/build-linux.sh
          --bytecode
          --verify
          --output dist/Starsown-bytecode.love

      - name: Upload Fedora artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Starsown-linux-fedora44
          path: dist/*.love
          if-no-files-found: ignore
